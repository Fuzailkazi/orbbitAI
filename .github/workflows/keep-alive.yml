# Backup for the Vercel Cron in vercel.json: pings /api/keep-alive so the Supabase free tier
# never sees 7 days of inactivity. Runs 12 hours after the Vercel cron, so the two are independent.
# A failed ping fails this workflow, and GitHub emails the repo owner — that's the alert.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   KEEP_ALIVE_URL  e.g. https://orbbit-ai.vercel.app
#   CRON_SECRET     same value as CRON_SECRET in Vercel
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/keep-alive
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the KEEP_ALIVE_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${KEEP_ALIVE_URL%/}/api/keep-alive"
